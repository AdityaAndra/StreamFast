<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#141414" />
    <meta name="description" content="Browse movies and TV shows and instantly generate VidFast streaming links." />
    <link rel="preconnect" href="https://image.tmdb.org" crossorigin />

    <title>VidFast — Watch Movies &amp; TV Shows</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['CustomFont', 'Helvetica Neue', 'Helvetica', 'Arial', 'sans-serif'],
            },
            colors: {
              'netflix-red': '#E50914',
              'netflix-red-dark': '#B20710',
              'netflix-dark': '#181818',
              'netflix-gray': '#808080',
              'netflix-bg': '#141414',
              'netflix-card': '#181818',
              'netflix-elevated': '#232323',
              'netflix-line': '#404040',
              'netflix-text': '#e5e5e5',
              'netflix-muted': '#b3b3b3',
              'netflix-green': '#46d369',
              'netflix-btn': 'rgba(109,109,110,0.7)',
            },
            transitionTimingFunction: {
              'netflix': 'cubic-bezier(0.5, 0, 0.1, 1)',
            },
            keyframes: {
              'fade-in': {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              'fade-in-up': {
                '0%': { opacity: '0', transform: 'translateY(1rem)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              'zoom-in': {
                '0%': { opacity: '0', transform: 'scale(0.97)' },
                '100%': { opacity: '1', transform: 'scale(1)' },
              },
              'fade-out-input': {
                'from': { color: 'white' },
                'to': { color: 'transparent' },
              },
              'pulse': {
                '50%': { opacity: '.5' },
              },
              'genie-in': {
                'from': { transform: 'scale(0)', opacity: '0', 'clip-path': 'inset(45% 45% 45% 45% round 50%)' },
                'to': { transform: 'scale(1)', opacity: '1', 'clip-path': 'inset(0% 0% 0% 0% round 0%)' },
              },
              'genie-out': {
                'from': { transform: 'scale(1)', opacity: '1', 'clip-path': 'inset(0% 0% 0% 0% round 0%)' },
                'to': { transform: 'scale(0)', opacity: '0', 'clip-path': 'inset(45% 45% 45% 45% round 50%)' },
              },
              'toast-in': {
                '0%': { opacity: '0', transform: 'translateY(16px) scale(0.98)' },
                '100%': { opacity: '1', transform: 'translateY(0) scale(1)' },
              },
              'dropdown-in': {
                '0%': { opacity: '0', transform: 'translateY(-6px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
            },
            animation: {
              'fade-in': 'fade-in 0.5s ease-out forwards',
              'fade-in-fast': 'fade-in 0.3s ease-out forwards',
              'fade-in-up': 'fade-in-up 0.5s ease-out forwards',
              'zoom-in': 'zoom-in 0.3s ease-out forwards',
              'zoom-in-fast': 'zoom-in 0.15s ease-out forwards',
              'fade-out-input': 'fade-out-input 0.8s ease-in-out forwards',
              'pulse': 'pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'genie-in': 'genie-in 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards',
              'genie-out': 'genie-out 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards',
              'toast-in': 'toast-in 0.35s cubic-bezier(0.5, 0, 0.1, 1) both',
              'dropdown-in': 'dropdown-in 0.18s ease-out both',
            }
          }
        }
      }
    </script>
    <style>
        html {
          font-size: 14px;
          background: #141414;
          color-scheme: dark;
          -webkit-tap-highlight-color: transparent;
        }
        body {
          background: #141414;
          color: #e5e5e5;
          -webkit-font-smoothing: antialiased;
          -moz-osx-font-smoothing: grayscale;
        }

        @font-face { font-family: 'CustomFont'; src: url('/assets/fonts/CustomFont-Light.otf') format('opentype'); font-weight: 300; font-style: normal; font-display: swap; }
        @font-face { font-family: 'CustomFont'; src: url('/assets/fonts/CustomFont-Regular.otf') format('opentype'); font-weight: 400; font-style: normal; font-display: swap; }
        @font-face { font-family: 'CustomFont'; src: url('/assets/fonts/CustomFont-Medium.otf') format('opentype'); font-weight: 500; font-style: normal; font-display: swap; }
        @font-face { font-family: 'CustomFont'; src: url('/assets/fonts/CustomFont-Bold.otf') format('opentype'); font-weight: 700; font-style: normal; font-display: swap; }

        /* Netflix-style thin scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #141414; }
        ::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #E50914; }

        input, button, select, textarea { font-family: inherit; }
        ::selection { background: rgba(229, 9, 20, 0.6); color: #fff; }

        /* Keyboard focus ring (mouse clicks stay clean) */
        :focus { outline: none; }
        :focus-visible { outline: 2px solid #fff; outline-offset: 2px; border-radius: 4px; }

        /* Apple Pay style checkmark animation */
        @keyframes draw-circle { to { stroke-dashoffset: 0; } }
        @keyframes draw-check { to { stroke-dashoffset: 0; } }
        .animate-draw-circle { stroke-dasharray: 63; stroke-dashoffset: 63; animation: draw-circle 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        .animate-draw-check { stroke-dasharray: 18; stroke-dashoffset: 18; animation: draw-check 0.6s cubic-bezier(0.25, 1, 0.5, 1) 0.5s forwards; }

        /* Animated Title (used by the player theme modal) */
        @keyframes scroll-gradient { to { background-position: 200% center; } }
        .animated-title {
            background: linear-gradient(90deg, #ef4444, #f97316, #eab308, #84cc16, #22c55e, #10b981, #06b6d4, #3b82f6, #8b5cf6, #d946ef, #ec4899, #ef4444);
            background-size: 200% auto;
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: scroll-gradient 4s linear infinite;
        }

        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

        /* ---------- Netflix-style building blocks ---------- */

        /* Skeleton shimmer */
        .shimmer { position: relative; overflow: hidden; background: #202020; }
        .shimmer::after {
            content: ''; position: absolute; inset: 0; transform: translateX(-100%);
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.045), transparent);
            animation: shimmer 1.6s infinite;
        }
        @keyframes shimmer { 100% { transform: translateX(100%); } }

        /* Billboard (hero) */
        .billboard-vignette {
            background:
              linear-gradient(77deg, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0) 85%),
              linear-gradient(180deg, rgba(20,20,20,0) 55%, rgba(20,20,20,0.15) 68%, rgba(20,20,20,0.4) 75%, #141414 100%);
        }
        .billboard-slide { animation: billboard-fade 1.1s ease-out both, ken-burns 16s ease-out both; }
        @keyframes billboard-fade { from { opacity: 0; } to { opacity: 1; } }
        @keyframes ken-burns { from { transform: scale(1.08); } to { transform: scale(1); } }
        .billboard-content { animation: billboard-content 0.9s cubic-bezier(0.5, 0, 0.1, 1) both; }
        @keyframes billboard-content { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
        .billboard-progress { animation: billboard-progress 9s linear forwards; }
        @keyframes billboard-progress { from { width: 0%; } to { width: 100%; } }
        .text-shadow-netflix { text-shadow: 2px 2px 4px rgba(0,0,0,0.45); }

        /* Top 10 outlined numbers */
        .top10-number {
            color: #141414;
            -webkit-text-stroke: 3px #595959;
            paint-order: stroke fill;
            font-weight: 700;
            letter-spacing: -0.08em;
            line-height: 0.78;
        }

        /* Hover preview card (portal) */
        .preview-pop { animation: preview-pop 0.28s cubic-bezier(0.5, 0, 0.1, 1) both; }
        @keyframes preview-pop {
            from { opacity: 0; transform: translateY(-50%) scale(var(--from-scale, 0.7)); }
            to   { opacity: 1; transform: translateY(-50%) scale(1); }
        }

        /* Page transition */
        .page-in { animation: page-in 0.45s cubic-bezier(0.5, 0, 0.1, 1) both; }
        @keyframes page-in { from { opacity: 0; } to { opacity: 1; } }

        /* Row item entrance */
        .row-item-in { animation: row-item-in 0.5s cubic-bezier(0.5, 0, 0.1, 1) both; }
        @keyframes row-item-in { from { opacity: 0; transform: translateX(12px); } to { opacity: 1; transform: translateX(0); } }

        /* Respect reduced-motion preferences */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
            /* The billboard timer bar drives auto-advance, keep its timing */
            .billboard-progress { animation-duration: 9s !important; }
        }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.1.0",
    "react-dom/": "https://esm.sh/react-dom@^19.1.0/",
    "react/": "https://esm.sh/react@^19.1.0/"
  }
}
</script>
</head>
  <body class="bg-netflix-bg font-sans text-netflix-text antialiased">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
