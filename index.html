<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#141414" />
    <!-- The site is already dark: stop dark-mode extensions (Dark Reader) from recolouring it. -->
    <meta name="darkreader-lock" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Watch movies and TV shows on StreamFast." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="StreamFast" />
    <meta property="og:title" content="StreamFast" />
    <meta property="og:description" content="Watch movies and TV shows on StreamFast." />
    <meta property="og:url" content="https://streamfast.vercel.app/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="StreamFast" />
    <meta name="twitter:description" content="Watch movies and TV shows on StreamFast." />
    <link rel="preconnect" href="https://image.tmdb.org" crossorigin />
    <link rel="dns-prefetch" href="https://image.tmdb.org" />
    <title>StreamFast — Watch TV Shows &amp; Movies</title>
    <script>
      /* StreamFast saved data.
         1) Old address (vidfast-link-generator.vercel.app) packs this browser's saved lists into the link
            and redirects to streamfast.vercel.app, which unpacks them.
         2) Data saved under the old VidFast names is moved to the StreamFast names (merged, newest wins). */
      (function () {
        var OLD = 'vidfast-link-generator.vercel.app';
        var NEW = 'https://streamfast.vercel.app';
        var RENAMES = {
          vidfast_continue_watching: 'streamfast_continue_watching',
          vidfast_my_list: 'streamfast_my_list',
          vidfast_player_theme: 'streamfast_player_theme',
          vidfast_recent_searches: 'streamfast_recent_searches',
          vf_region: 'sf_region',
          vf_bell_seen: 'sf_bell_seen',
          vf_server: 'sf_server'
        };
        var NEW_KEYS = Object.keys(RENAMES).map(function (k) { return RENAMES[k]; });
        var ALL_KEYS = Object.keys(RENAMES).concat(NEW_KEYS);
        var TAGS = ['#sfmove=', '#vfmove='];
        var b64 = function (bytes) {
          var s = '';
          for (var i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
          return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        };
        var unb64 = function (str) {
          str = str.replace(/-/g, '+').replace(/_/g, '/');
          while (str.length % 4) str += '=';
          var s = atob(str), out = new Uint8Array(s.length);
          for (var i = 0; i < s.length; i++) out[i] = s.charCodeAt(i);
          return out;
        };
        var pipe = function (bytes, stream) {
          return new Response(new Blob([bytes]).stream().pipeThrough(stream)).arrayBuffer().then(function (b) { return new Uint8Array(b); });
        };
        var stamp = function (x) { return (x && (x.savedAt || x.addedAt)) || 0; };
        var newName = function (k) { return RENAMES[k] || k; };

        /* Merge a saved value into key k: lists are combined (newest copy of each title wins),
           settings already set here are kept. */
        var mergeInto = function (k, value) {
          var mine = localStorage.getItem(k);
          if (mine === null) { localStorage.setItem(k, value); return; }
          var a, c;
          try { a = JSON.parse(mine); c = JSON.parse(value); } catch (e) { return; }
          if (!Array.isArray(a) || !Array.isArray(c)) return;
          if (a.every(function (x) { return typeof x === 'string'; })) {
            localStorage.setItem(k, JSON.stringify(a.concat(c.filter(function (x) { return a.indexOf(x) < 0; })).slice(0, 12)));
            return;
          }
          var id = function (x) { return x && x.media ? x.media.media_type + ':' + x.media.id : JSON.stringify(x); };
          var map = {}, order = [];
          c.concat(a).forEach(function (x) {
            var key = id(x);
            if (!(key in map)) order.push(key);
            if (!(key in map) || stamp(x) >= stamp(map[key])) map[key] = x;
          });
          localStorage.setItem(k, JSON.stringify(order.map(function (key) { return map[key]; }).sort(function (x, y) { return stamp(y) - stamp(x); })));
        };
        var migrate = function () {
          try {
            Object.keys(RENAMES).forEach(function (oldKey) {
              var v = localStorage.getItem(oldKey);
              if (v === null) return;
              mergeInto(RENAMES[oldKey], v);
              localStorage.removeItem(oldKey);
            });
          } catch (e) {}
        };

        try {
          /* ---- old address: send everything to the new one ---- */
          if (location.hostname === OLD) {
            window.__sfReady = new Promise(function () {}); // never start the app here
            var target = NEW + location.pathname + location.search;
            var data = {};
            try {
              ALL_KEYS.forEach(function (k) { var v = localStorage.getItem(k); if (v !== null) data[newName(k)] = v; });
            } catch (e) {}
            if (!Object.keys(data).length) { location.replace(target); return; }
            var raw = new TextEncoder().encode(JSON.stringify(data));
            var go = function (enc) { location.replace(target + TAGS[0] + enc); };
            if (typeof CompressionStream === 'function') {
              pipe(raw, new CompressionStream('deflate-raw')).then(function (z) { go('z.' + b64(z)); }, function () { go('j.' + b64(raw)); });
            } else go('j.' + b64(raw));
            return;
          }

          migrate();

          /* ---- new address: unpack and merge with anything already saved here ---- */
          var tag = TAGS.filter(function (t) { return location.hash.indexOf(t) === 0; })[0];
          if (tag) {
            var payload = location.hash.slice(tag.length);
            history.replaceState(history.state, '', location.pathname + location.search);
            /* Only accept moved data when the visitor really came from the old address, so a link
               someone else made can't add titles to your lists. */
            var fromOld = (document.referrer || '').indexOf('https://' + OLD) === 0;
            if (!fromOld) payload = '';
            var kind = payload.slice(0, 2);
            var bytes = unb64(payload.slice(2));
            var decoded =
              !payload ? Promise.reject(new Error('not from the old address'))
              : kind === 'z.' && typeof DecompressionStream === 'function' ? pipe(bytes, new DecompressionStream('deflate-raw'))
              : kind === 'j.' ? Promise.resolve(bytes)
              : Promise.reject(new Error('unknown'));
            window.__sfReady = decoded.then(function (b) {
              var incoming = JSON.parse(new TextDecoder().decode(b));
              Object.keys(incoming).forEach(function (k) {
                var to = newName(k);
                if (NEW_KEYS.indexOf(to) < 0 || typeof incoming[k] !== 'string') return;
                mergeInto(to, incoming[k]);
              });
            }).catch(function () {});
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-netflix-bg font-sans text-netflix-text antialiased">
    <noscript>You need to enable JavaScript to use StreamFast.</noscript>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
